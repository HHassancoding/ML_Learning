name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: Lint with flake8
        run: |
          flake8 Stocks_Full_Stack/ --max-line-length=120 --exclude=__pycache__,.git --count --show-source --statistics

      - name: Format with Black
        run: |
          black --check Stocks_Full_Stack/ --exclude=__pycache__

      - name: Sort imports with isort
        run: |
          isort --check-only Stocks_Full_Stack/

      - name: Type check with mypy
        run: |
          mypy Stocks_Full_Stack/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Stocks_Full_Stack/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          cd Stocks_Full_Stack
          pytest tests/ -v --cov=. --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t stock-app:${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker images | grep stock-app