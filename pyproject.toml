[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocks-full-stack"
version = "0.1.0"
description = "Stock analysis and prediction utilities"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "yfinance",
  "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"